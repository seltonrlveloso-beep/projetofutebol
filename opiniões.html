<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>opiniões</title>
    <link rel="stylesheet" href= "opiniões.css">
</head>
<body>
    <H1> Essa Pagina é para você me avaliar </H1>
    <h1>Deixe sua opinião</h1>

<form>

    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" placeholder="Digite seu nome">

    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" placeholder="Digite seu e-mail">

    <label for="jogador">Qual jogador você mais gosta?</label>
    <select id="jogador" name="jogador">
        <option>Pelé</option>
        <option>Messi</option>
        <option>Cristiano Ronaldo</option>
        <option>Neymar</option>
        <option>Outro</option>
    </select>

    <label>O que você achou do site?</label>

    <label>
        <input type="radio" name="opiniao" value="otimo">
        Ótimo
    </label>

    <label>
        <input type="radio" name="opiniao" value="bom">
        Bom
    </label>

    <label>
        <input type="radio" name="opiniao" value="regular">
        Regular
    </label>

    <label>
        <input type="radio" name="opiniao" value="ruim">
        Ruim
    </label>

    <label for="mensagem">Deixe sua sugestão:</label>
    <textarea id="mensagem" name="mensagem" rows="6"
        placeholder="Escreva sua opinião aqui..."></textarea>

    <button type="submit">Enviar opinião</button>

</form>
<a href="index.html" class="voltar"> Voltar</a>   







<footer class="rodape">
    <h3>Opiniões</h3>
    <p class="direitos">
        © 2026 - Opiniões | Projeto escolar
    </p>
</footer>

</body>
</html>
